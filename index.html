var LSKEY='kaimono_unlock_jwk_v1';
var cancelled=false;
function ub(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function show(html){ document.open(); document.write(html); document.close(); }
async function decryptWith(key){
 var plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:ub(IV)}, key, ub(DATA));
 return new TextDecoder().decode(plain);
}
async function open_(){
 var pw=document.getElementById('pw').value;
 var err=document.getElementById('err'); err.textContent='';
 try{
  var km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:ub(SALT), iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, true, ['decrypt']);
  var html=await decryptWith(key);
  try{ var jwk=await crypto.subtle.exportKey('jwk', key); localStorage.setItem(LSKEY, JSON.stringify({salt:SALT, jwk:jwk})); }catch(e){}
  show(html);
 }catch(e){ err.textContent='パスワードが違います。'; }
}
async function autoOpen(){
 var stat=document.getElementById('stat');
 var saved=null;
 try{ saved=JSON.parse(localStorage.getItem(LSKEY)||'null'); }catch(e){}
 if(!saved || saved.salt!==SALT || !saved.jwk){ return; }
 document.getElementById('forget').style.display='';
 stat.textContent='この端末に記憶した鍵で開いています…';
 try{
  var key=await crypto.subtle.importKey('jwk', saved.jwk, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var html=await decryptWith(key);
  if(!cancelled) show(html);
 }catch(e){
  try{ localStorage.removeItem(LSKEY); }catch(e2){}
  stat.textContent='';
  document.getElementById('forget').style.display='none';
 }
}
document.getElementById('go').addEventListener('click', open_);
document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') open_(); });
document.getElementById('forget').addEventListener('click', function(){ cancelled=true; try{ localStorage.removeItem(LSKEY); }catch(e){} document.getElementById('stat').textContent='記憶を消しました。パスワードを入力してください。'; this.style.display='none'; });
autoOpen();
