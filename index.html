<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>音声文字起こし</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f2f3f1;
        --ink: #111410;
        --muted: #8a8f88;
        --line: #cfd3cc;
        --dot-on: #84d400;
        --btn-bg: #eef0ec;
        --btn-ink: #111410;
        --banner-bg: #0a7d4f;
        --banner-ink: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", sans-serif;
        -webkit-text-size-adjust: 100%;
        overflow: hidden;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible { outline: 4px solid #0a7d4f; outline-offset: 2px; }
      button:disabled { opacity: .45; cursor: default; }

      .app {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        gap: 12px;
      }

      /* 上段 */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 58px;
      }
      .dot {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #ffffff;
        flex: none;
      }
      .dot.on {
        background: var(--dot-on);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(132, 212, 0, .4); }
        50% { box-shadow: 0 0 0 12px rgba(132, 212, 0, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot.on { animation: none; }
      }
      .font-controls {
        display: flex;
        gap: 10px;
      }
      .font-btn {
        min-height: 56px;
        min-width: 112px;
        padding: 10px 24px;
        font-size: clamp(20px, 3vmin, 26px);
        font-weight: 800;
        background: var(--btn-bg);
        color: var(--btn-ink);
        border: 2px solid var(--line);
        border-radius: 12px;
      }
      .font-btn:active { transform: scale(.97); }

      /* 中央ステージ（タップで開始／一時停止） */
      .stage {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface);
        border-radius: 16px;
        padding: 20px 28px;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .tap-box {
        background: #ffffff;
        color: var(--ink);
        border-radius: 8px;
        padding: 34px 48px;
        width: min(82%, 720px);
        text-align: center;
        font-size: clamp(28px, 4.6vmin, 42px);
        font-weight: 500;
        letter-spacing: .04em;
      }
      .sentence {
        margin: 0;
        width: 100%;
        text-align: center;
        font-weight: 800;
        line-height: 1.35;
        letter-spacing: .01em;
        word-break: normal;
        overflow-wrap: break-word;
      }
      .sentence .interim { color: var(--muted); }
      .sentence.placeholder { color: var(--muted); }

      /* 下段：応答ボタン（白背景・文字大） */
      .responses {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .resp-btn {
        min-height: 92px;
        padding: 14px 8px;
        font-size: clamp(28px, 4.8vmin, 46px);
        font-weight: 900;
        letter-spacing: .03em;
        background: #ffffff;
        color: #111410;
        border: 2px solid var(--line);
        border-radius: 14px;
      }
      .resp-btn:active { transform: scale(.97); }

      /* 応答バナー */
      .banner {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--banner-bg);
        color: var(--banner-ink);
        padding: 24px;
        cursor: pointer;
      }
      .banner.show { display: flex; }
      .banner-text {
        font-size: clamp(64px, 17vmin, 190px);
        font-weight: 900;
        letter-spacing: .04em;
        text-align: center;
        line-height: 1.2;
      }

      @media (max-width: 640px) {
        .responses { grid-template-columns: repeat(2, 1fr); }
        .resp-btn { min-height: 80px; }
        .font-btn { min-height: 50px; min-width: 92px; padding: 8px 16px; }
        .tap-box { padding: 26px 20px; width: 92%; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <span class="dot" id="dot" aria-label="状態"></span>
        <div class="font-controls">
          <button type="button" class="font-btn" id="fontDown">文字 小</button>
          <button type="button" class="font-btn" id="fontUp">文字 大</button>
        </div>
      </div>

      <main class="stage" id="stage" role="button" tabindex="0" aria-label="音声認識の開始と一時停止">
        <div class="tap-box" id="tapBox">ここをタップ</div>
        <p class="sentence placeholder" id="sentence" style="display:none;">話しかけてください</p>
      </main>

      <div class="responses">
        <button type="button" class="resp-btn" data-resp="わかった">わかった</button>
        <button type="button" class="resp-btn" data-resp="もう一度">もう一度</button>
        <button type="button" class="resp-btn" data-resp="はい">はい</button>
        <button type="button" class="resp-btn" data-resp="いいえ">いいえ</button>
      </div>
    </div>

    <div class="banner" id="banner" role="alert">
      <div class="banner-text" id="bannerText"></div>
    </div>

    <script>
      (function () {
        'use strict';

        var dot = document.getElementById('dot');
        var stage = document.getElementById('stage');
        var tapBox = document.getElementById('tapBox');
        var sentenceEl = document.getElementById('sentence');
        var banner = document.getElementById('banner');
        var bannerText = document.getElementById('bannerText');

        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        var supported = typeof SR === 'function';

        var userPaused = true;
        var recognition = null;
        var running = false;
        var restartTimer = null;
        var wakeLock = null;
        var startedAtMs = 0;

        var latestFinal = '';
        var currentInterim = '';

        /* ---------- 文字サイズ ---------- */
        var LEVELS = [56, 72, 88, 106, 126];
        var levelIdx = 2;

        function fitText() {
          if (sentenceEl.style.display === 'none') return;
          var size = LEVELS[levelIdx];
          var maxH = stage.clientHeight - 40;
          var maxW = stage.clientWidth - 56;
          sentenceEl.style.fontSize = size + 'px';
          var guard = 0;
          while (size > 26 && guard < 60 &&
                 (sentenceEl.scrollHeight > maxH || sentenceEl.scrollWidth > maxW)) {
            size -= 4;
            sentenceEl.style.fontSize = size + 'px';
            guard++;
          }
        }

        document.getElementById('fontUp').addEventListener('click', function () {
          if (levelIdx < LEVELS.length - 1) { levelIdx++; fitText(); }
        });
        document.getElementById('fontDown').addEventListener('click', function () {
          if (levelIdx > 0) { levelIdx--; fitText(); }
        });
        window.addEventListener('resize', fitText);

        /* ---------- 表示 ---------- */
        function render() {
          sentenceEl.classList.remove('placeholder');
          if (currentInterim) {
            sentenceEl.innerHTML = '';
            var span = document.createElement('span');
            span.className = 'interim';
            span.textContent = currentInterim;
            sentenceEl.appendChild(span);
          } else if (latestFinal) {
            sentenceEl.textContent = latestFinal;
          } else {
            sentenceEl.classList.add('placeholder');
            sentenceEl.textContent = '話しかけてください';
          }
          fitText();
        }

        function showMessage(text) {
          latestFinal = '';
          currentInterim = '';
          tapBox.style.display = 'none';
          sentenceEl.style.display = 'block';
          sentenceEl.classList.remove('placeholder');
          sentenceEl.textContent = text;
          fitText();
        }

        function setListeningUi(listening) {
          if (listening) {
            dot.classList.add('on');
            tapBox.style.display = 'none';
            sentenceEl.style.display = 'block';
            render();
          } else {
            dot.classList.remove('on');
            sentenceEl.style.display = 'none';
            tapBox.style.display = 'block';
          }
        }

        /* ---------- Wake Lock ---------- */
        function requestWakeLock() {
          if (!('wakeLock' in navigator)) return;
          navigator.wakeLock.request('screen').then(function (lock) {
            wakeLock = lock;
          }).catch(function () {});
        }
        function releaseWakeLock() {
          if (wakeLock) {
            wakeLock.release().catch(function () {});
            wakeLock = null;
          }
        }

        function pauseForLeave() {
          if (!userPaused || running || recognition) {
            userPaused = true;
            setListeningUi(false);
            releaseWakeLock();
            stopRecognition();
          }
        }
        document.addEventListener('visibilitychange', function () {
          // マイク許可ダイアログ直後の誤爆を防ぐため開始1.5秒以降のみ自動停止
          if (document.visibilityState === 'hidden' && !userPaused && (Date.now() - startedAtMs > 1500)) {
            pauseForLeave();
          }
        });
        window.addEventListener('pagehide', pauseForLeave);
        window.addEventListener('beforeunload', pauseForLeave);

        /* ---------- 音声認識 ---------- */
        function buildRecognition() {
          var rec = new SR();
          rec.lang = 'ja-JP';
          rec.continuous = true;
          rec.interimResults = true;
          rec.maxAlternatives = 1;

          rec.onstart = function () {
            if (rec !== recognition) return;
            running = true;
          };

          rec.onresult = function (event) {
            if (rec !== recognition || userPaused) return;
            var interim = '';
            for (var i = event.resultIndex; i < event.results.length; i++) {
              var result = event.results[i];
              if (result.isFinal) {
                var text = result[0].transcript.trim();
                if (text) latestFinal = text;
                interim = '';
              } else {
                interim += result[0].transcript;
              }
            }
            currentInterim = interim.trim();
            render();
          };

          rec.onend = function () {
            if (rec !== recognition) return;
            running = false;
            recognition = null;
            if (!userPaused) {
              restartTimer = setTimeout(function () {
                if (!userPaused) startRecognition();
              }, 300);
            }
          };

          rec.onerror = function (event) {
            if (rec !== recognition) return;
            var err = event && event.error ? event.error : 'unknown';
            if (err === 'not-allowed' || err === 'service-not-allowed') {
              userPaused = true;
              running = false;
              dot.classList.remove('on');
              releaseWakeLock();
              if (err === 'service-not-allowed') {
                showMessage('音声認識が許可されていません（iPad/iPhoneは「設定→一般→キーボード→音声入力」をオン、Safari→マイクを許可にしてください）');
              } else {
                showMessage('マイクが使えません（Safariのマイク許可を確認してください）');
              }
            } else if (err === 'audio-capture') {
              userPaused = true;
              running = false;
              dot.classList.remove('on');
              releaseWakeLock();
              showMessage('マイク入力を取得できませんでした');
            }
          };

          return rec;
        }

        function startRecognition() {
          if (!supported || userPaused) return;
          if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
          if (recognition) {
            var old = recognition;
            recognition = null;
            old.onstart = old.onresult = old.onend = old.onerror = null;
            try { old.stop(); } catch (e) {}
          }
          var rec = buildRecognition();
          recognition = rec;
          try {
            rec.start();
            running = true;
          } catch (e) {
            running = false;
            if (recognition === rec) recognition = null;
            restartTimer = setTimeout(function () {
              if (!userPaused) startRecognition();
            }, 350);
          }
        }

        function stopRecognition() {
          if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
          if (recognition) {
            var old = recognition;
            recognition = null;
            old.onstart = old.onresult = old.onend = old.onerror = null;
            try { old.stop(); } catch (e) {}
          }
          running = false;
        }

        function toggleListening() {
          if (!supported) return;
          if (userPaused) {
            userPaused = false;
            startedAtMs = Date.now();
            setListeningUi(true);
            requestWakeLock();
            startRecognition();
          } else {
            userPaused = true;
            setListeningUi(false);
            releaseWakeLock();
            stopRecognition();
          }
        }

        stage.addEventListener('click', toggleListening);
        stage.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleListening();
          }
        });

        /* ---------- 応答ボタン ---------- */
        var bannerTimer = null;
        function hideBanner() {
          banner.classList.remove('show');
          if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
        }
        var respBtns = document.querySelectorAll('.resp-btn');
        for (var b = 0; b < respBtns.length; b++) {
          respBtns[b].addEventListener('click', function () {
            bannerText.textContent = this.getAttribute('data-resp');
            banner.classList.add('show');
            if (bannerTimer) clearTimeout(bannerTimer);
            bannerTimer = setTimeout(hideBanner, 5000);
          });
        }
        banner.addEventListener('click', hideBanner);

        /* ---------- 初期化 ---------- */
        if (!supported) {
          showMessage('このブラウザは音声認識に対応していません');
        }
      })();
    </script>
  </body>
</html>
